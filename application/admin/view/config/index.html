{extend name="public/layout" /}
{block name="content"}
<div class="panel panel-default">
    <div class="panel-heading">系统配置</div>
    <div class="panel-body">
        <form id="configForm" class="form-horizontal" style="max-width:560px;">
            <div class="form-group">
                <label class="col-sm-3 control-label">站点名称</label>
                <div class="col-sm-9"><input type="text" class="form-control" name="site_name" value="{$site_name}"></div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">系统公告</label>
                <div class="col-sm-9"><input type="text" class="form-control" name="site_notice" value="{$site_notice}"></div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-3 col-sm-9">
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </div>
        </form>
    </div>
</div>
{/block}
{block name="script"}
<script>
$('#configForm').on('submit', function (e) {
    e.preventDefault();
    $.post("{:url('admin/config/index')}", $(this).serialize(), function (res) {
        alert(res.msg);
        if (res.code === 1) location.reload();
    }, 'json');
});
</script>
{/block}
