<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(135deg, #3a7bd5, #3a6073); min-height: 100vh; }
        .login-box { width: 380px; margin: 10% auto; background: #fff; border-radius: 6px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
        .login-box h3 { margin-top: 0; margin-bottom: 24px; text-align: center; }
        .tip { color: #999; font-size: 12px; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
<div class="login-box">
    <h3>后台管理系统</h3>
    <form id="loginForm">
        <div class="form-group">
            <label>账号</label>
            <input type="text" class="form-control" name="username" placeholder="请输入账号" value="admin">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" class="form-control" name="password" placeholder="请输入密码" value="123456">
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
        <div class="tip">默认账号 admin / 123456</div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script>
$('#loginForm').on('submit', function (e) {
    e.preventDefault();
    $.post("{:url('admin/login/doLogin')}", $(this).serialize(), function (res) {
        alert(res.msg);
        if (res.code === 1) {
            location.href = res.url;
        }
    }, 'json');
});
</script>
</body>
</html>
