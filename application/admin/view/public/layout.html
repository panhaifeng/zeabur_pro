<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{$siteName|default='后台管理系统'}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <style>
        body { background: #f5f7fb; }
        .sidebar { min-height: 100vh; background: #2f3b52; color: #fff; padding: 0; }
        .sidebar .brand { padding: 18px 16px; font-size: 18px; font-weight: bold; background: #263247; }
        .sidebar a { display: block; color: #cfd8e6; padding: 12px 18px; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { background: #1f8ceb; color: #fff; }
        .topbar { background: #fff; border-bottom: 1px solid #e5e9f2; padding: 12px 20px; margin-bottom: 20px; }
        .panel { box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        .content-wrap { padding: 0 20px 20px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-2 sidebar">
            <div class="brand">{$siteName|default='后台管理系统'}</div>
            <a href="{:url('admin/index/index')}" class="{$menu=='index'?'active':''}">首页</a>
            <a href="{:url('admin/user/index')}" class="{$menu=='user'?'active':''}">用户管理</a>
            <a href="{:url('admin/config/index')}" class="{$menu=='config'?'active':''}">系统配置</a>
        </div>
        <div class="col-sm-10">
            <div class="topbar clearfix">
                <div class="pull-left">欢迎，{if condition="$adminUser.nickname"}{$adminUser.nickname}{else/}{$adminUser.username}{/if}</div>
                <div class="pull-right"><a href="{:url('admin/login/logout')}">退出登录</a></div>
            </div>
            <div class="content-wrap">
                {block name="content"}{/block}
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
{block name="script"}{/block}
</body>
</html>
