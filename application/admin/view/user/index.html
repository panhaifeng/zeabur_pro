{extend name="public/layout" /}
{block name="content"}
<div class="panel panel-default">
    <div class="panel-heading clearfix">
        <span class="pull-left">用户管理</span>
        <a class="btn btn-primary btn-xs pull-right" href="{:url('admin/user/add')}">新增用户</a>
    </div>
    <div class="panel-body">
        <form class="form-inline" method="get" action="{:url('admin/user/index')}" style="margin-bottom:15px;">
            <input type="text" class="form-control" name="keyword" value="{$keyword}" placeholder="用户名/昵称">
            <button class="btn btn-default" type="submit">搜索</button>
        </form>
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th width="60">ID</th>
                <th>用户名</th>
                <th>昵称</th>
                <th width="80">状态</th>
                <th width="160">创建时间</th>
                <th width="140">操作</th>
            </tr>
            </thead>
            <tbody>
            {volist name="list" id="vo"}
            <tr>
                <td>{$vo.id}</td>
                <td>{$vo.username}</td>
                <td>{$vo.nickname}</td>
                <td>{if $vo.status == 1}<span class="label label-success">正常</span>{else/}<span class="label label-default">禁用</span>{/if}</td>
                <td>{$vo.create_time}</td>
                <td>
                    <a class="btn btn-xs btn-info" href="{:url('admin/user/edit', ['id'=>$vo.id])}">编辑</a>
                    <a class="btn btn-xs btn-danger btn-del" href="javascript:;" data-id="{$vo.id}">删除</a>
                </td>
            </tr>
            {/volist}
            </tbody>
        </table>
        <div>{$list}</div>
    </div>
</div>
{/block}
{block name="script"}
<script>
$('.btn-del').on('click', function () {
    if (!confirm('确定删除该用户吗？')) return;
    var id = $(this).data('id');
    $.post("{:url('admin/user/delete')}", {id: id}, function (res) {
        alert(res.msg);
        if (res.code === 1) location.reload();
    }, 'json');
});
</script>
{/block}
